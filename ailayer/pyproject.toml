[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ailayer"
version = "0.1.0-alpha"
description = "Inject skills, hooks, MCP servers, and instruction files into agentic coding tools (Claude Code, Codex CLI, Gemini CLI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Purpose Green", email = "pavlo.maksymov@purpose-green.com" }]
keywords = ["ai", "agents", "claude", "codex", "gemini", "cli", "mcp", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "PyYAML>=6",
]

[project.scripts]
ailayer = "ailayer.main:main"

[project.urls]
Repository = "https://github.com/purpose-green/ailayer"
"Bug Tracker" = "https://github.com/purpose-green/ailayer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ailayer*"]

[tool.ruff]
line-length = 100
target-version = "py310"
